# Upstream golang.org/x/tools has no GitHub Actions CI: it is developed on
# Gerrit and tested by the Go build dashboard. This workflow packages the
# module zip the way the module proxy does, and runs the repo's own
# `go test ./...` on Linux, macOS and Windows with the contemporary Go 1.12
# toolchain (go.mod has no go directive; this snapshot is from March 2019 and
# Go 1.12 was released in February 2019).
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Go package pattern(s) to test instead of ./..."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build module zip helper
        run: |
          set -eux
          HELPER="$(mktemp -d)"
          cp .github/create_mod.go "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" create_mod.go

      - name: Stage module source
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/zipsrc"
          tar -c --exclude=.git --exclude=.github -C "$GITHUB_WORKSPACE" . | tar -x -C "$RUNNER_TEMP/zipsrc"
          test ! -e "$RUNNER_TEMP/zipsrc/.git"
          test ! -e "$RUNNER_TEMP/zipsrc/.github"
          test -f "$RUNNER_TEMP/zipsrc/go.mod"
          test -f "$RUNNER_TEMP/zipsrc/.gitignore"
          test -f "$RUNNER_TEMP/zipsrc/.gitattributes"

      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/create_mod" golang.org/x/tools v0.0.0-20190311212946-11955173bddd "$RUNNER_TEMP/zipsrc" "$RUNNER_TEMP/out/v0.0.0-20190311212946-11955173bddd.zip"
          count="$(unzip -Z1 "$RUNNER_TEMP/out/v0.0.0-20190311212946-11955173bddd.zip" | wc -l)"
          test "$count" -eq 1016

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.0.0-20190311212946-11955173bddd.zip
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-14
            arch: x64
          - os: windows-latest
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      GO111MODULE: "on"
      GOPROXY: https://proxy.golang.org
      GOFLAGS: ""
    steps:
      - name: Disable CRLF conversion
        shell: bash
        run: |
          set -eux
          git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.12.17"
          architecture: ${{ matrix.arch }}
          cache: false

      # Go 1.12's cgo cannot parse DWARF from the current Xcode clang
      # ("malformed DWARF TagVariable entry" in crypto/x509), so macOS legs
      # build pure-Go. macos-14 x64 runs under Rosetta, which still executes
      # Go 1.12 binaries that lack LC_UUID.
      - name: Disable cgo (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"

      # The runner's gcc (UCRT) lacks __imp___iob_func, which Go 1.12
      # runtime/cgo needs; install the MSVCRT-based mingw 8.1.0 instead.
      - name: Install mingw 8.1.0 (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          choco install mingw --version 8.1.0 -y --no-progress
          echo 'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin' >> "$GITHUB_PATH"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check gcc version (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          gcc --version | head -1
          gcc --version | grep -F 8.1.0

      - name: Go environment
        run: |
          set -eux
          go version
          go env

      # cmd/splitdwarf/splitdwarf.go is `+build !windows`, so on Windows the
      # package has only doc.go and no main; exclude it there.
      - name: go build
        run: |
          set -eux
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build $(go list ./... | grep -v '/cmd/splitdwarf$')
          else
            go build ./...
          fi

      # -p 1 because cmd/godoc TestWebIndex times out ("Server failed to
      # respond in 2m0s") under parallel package builds.
      - name: go test
        run: |
          set -eux
          rc=0
          go test -p 1 -v ${{ inputs.test-filter || './...' }} > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/test.log"
          echo "=== TEST SUMMARY ==="
          # awk (not grep -c) so a zero count does not abort under set -e;
          # the step result is go test's exit code below.
          echo "passed: $(awk '/--- PASS/{n++} END{print n+0}' "$RUNNER_TEMP/test.log")"
          echo "failed: $(awk '/--- FAIL/{n++} END{print n+0}' "$RUNNER_TEMP/test.log")"
          echo "skipped: $(awk '/--- SKIP/{n++} END{print n+0}' "$RUNNER_TEMP/test.log")"
          echo "packages ok: $(awk '/^ok /{n++} END{print n+0}' "$RUNNER_TEMP/test.log")"
          echo "packages failed: $(awk '/^FAIL/{n++} END{print n+0}' "$RUNNER_TEMP/test.log")"
          exit "$rc"
